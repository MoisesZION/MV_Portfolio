<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Moisés Varela</title>
    <style>
      :root { --bg: #657368; --ink: #f3f6ef; --muted: #d3dacd; --accent: #c8dcb7; }
      body { margin: 0; min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 16px;
             background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      h1 { font-size: clamp(2rem, 7vw, 3.5rem); margin: 0 0 8px; }
      p { color: var(--muted); }
      a { color: var(--accent); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>Page not found</h1>
      <p>This location is off the map.</p>
      <p><a id="home" href="/">Back to the homepage</a></p>
    </main>
    <script>
      // On a GitHub Pages project site the homepage lives under /<repo>/.
      var host = location.hostname, seg = location.pathname.split("/")[1];
      if (/\.github\.io$/.test(host) && seg && seg.toLowerCase() !== host.toLowerCase()) {
        document.getElementById("home").href = "/" + seg + "/";
      }
    </script>
  </body>
</html>
